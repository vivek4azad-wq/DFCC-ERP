<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DFCCIL 3D E-Manuals & Correction Slips Reader</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- StPageFlip 3D HTML5 Flipbook Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  
  <link rel="stylesheet" href="flipbook.css">
</head>
<body>
  <div class="flipbook-container">
    <!-- Top Header -->
    <header class="flipbook-header">
      <div class="header-left">
        <div class="header-title-box">
          <span class="header-title" id="headerTitle">DFC Railroad Manual (Final)</span>
          <span class="header-subtitle">DFCCIL IMSD SMUN • 3D E-Library</span>
        </div>
        
        <!-- Book Selector -->
        <div class="book-select-wrapper">
          <select id="bookSelect" class="book-select">
            <option value="">Loading Manuals...</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>

        <!-- Quick ACS Badges -->
        <div class="acs-chip-group">
          <button class="acs-chip" data-book="acs_01">ACS 01</button>
          <button class="acs-chip" data-book="acs_02">ACS 02</button>
          <button class="acs-chip" data-book="acs_03">ACS 03</button>
          <button class="acs-chip" data-book="acs_04">ACS 04</button>
          <button class="acs-chip" data-book="acs_05">ACS 05</button>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="header-actions">
        <button id="searchBtn" class="btn-icon" title="Search in Manual">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button id="thumbBtn" class="btn-icon" title="Thumbnail Pages Grid">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </button>
        <button id="soundBtn" class="btn-icon active" title="Sound: ON">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button id="fullscreenBtn" class="btn-icon" title="Toggle Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Flipbook Stage -->
    <main class="flipbook-stage" id="stage">
      <button id="prevBtn" class="nav-arrow prev" title="Previous Page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </button>

      <div class="book-wrapper" id="bookWrapper">
        <div id="book" class="st-page-flip"></div>
      </div>

      <button id="nextBtn" class="nav-arrow next" title="Next Page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <!-- Loading Overlay -->
      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div id="loadingText" class="loading-text">Loading 3D E-Book...</div>
        <div class="loading-bar-wrapper">
          <div id="loadingBar" class="loading-bar-fill"></div>
        </div>
      </div>
    </main>

    <!-- Bottom Control Bar -->
    <footer class="flipbook-toolbar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="prevBtnBottom" class="btn-icon" title="Previous Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="nextBtnBottom" class="btn-icon" title="Next Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="toolbar-center">
        <div class="page-counter">
          <span>Go to:</span>
          <input type="number" id="pageInput" class="page-input" min="1" value="1">
          <input type="range" id="pageSlider" class="page-slider" min="1" value="1">
          <span id="pageInfo">Page 1 of 1</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="zoomOutBtn" class="btn-icon" title="Zoom Out (-)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <span id="zoomLevelText" style="font-size: 11px; font-weight: 700; color: #cbd5e1; min-width: 36px; text-align: center;">100%</span>
        <button id="zoomInBtn" class="btn-icon" title="Zoom In (+)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button id="zoomResetBtn" class="btn-icon" title="Reset Zoom">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </footer>

    <!-- Thumbnails Bottom Drawer -->
    <div id="thumbnailsDrawer" class="thumbnails-drawer"></div>

    <!-- Search Modal -->
    <div id="searchModal" class="search-modal">
      <div class="search-input-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search keywords (e.g. Turnout, LWR, Axle)...">
        <button id="searchCloseBtn" class="btn-icon" style="flex: 0 0 34px;">✕</button>
      </div>
      <div id="searchResults" class="search-results-list"></div>
    </div>
  </div>

  <script src="flipbook.js"></script>
</body>
</html>
